  `{{ .ConfirmationURL }}` / a magic link — the app verifies via code entry
  (supabase.auth.verifyOtp), not a link click.
-->
<h2>Confirm your email</h2>
<p>Use the verification code below to finish creating your ExeterTrustCo account:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px;margin:24px 0;">{{ .Token }}</p>
